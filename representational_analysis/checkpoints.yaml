# Checkpoint manifest -- source of truth for extract_representations.py and analysis.py.
# Add/remove/edit rows here; no code changes needed to compare arbitrary groups.
#
# `id` is always identical to the experiment folder name under ../experiments/
# (i.e. `id: X` implies `adapter_path: ../experiments/X/final_model`), except for
# the two `base_*` rows, which have no experiment folder at all (raw pretrained
# model, no adapter).
#
# trajectory values in use:
#   base            -- untrained pretrained model, no adapter
#   ultrachat_only  -- UltraChat-only utility data, no OR-Bench mixed in
#   or_untrimmed    -- UltraChat + OR-Bench, untrimmed answers ("_NEW" folders --
#                      verified via the "[OR] selecting OR dataset" print marker
#                      in each run's slurm-<jobid>.out; that diagnostic uses
#                      print(), not logging.info(), so it never appears in
#                      run_experiments.log)
#   or_trimmed      -- UltraChat + OR-Bench, trimmed answers ("_TRIMMED" folders)
#
# hyperparam_config identifies which named CAT config/hyperparameter profile a
# checkpoint uses, independent of which base model it's trained on. For the two
# Llama-3 "no like-prefix" families below, the mapping to likeZephyr/likeLlama2
# is via `trainer_hparams.away_cutoff` (-5.0 vs -7.5), which is the field that
# actually discriminates the two profiles -- not eps, which is set per-run via
# --eps at sbatch time and varies independently of which profile is used.
#   zephyr      -- zephyr-7b-beta's own native hyperparameter profile
#   likeZephyr  -- Llama-3 trained with the profile matching zephyr's defaults
#                  (away_cutoff=-5.0)
#   likeLlama2  -- Llama-3 trained with the profile matching llama2's defaults
#                  (away_cutoff=-7.5)
#
# All eps/relative_lr/seed values below are taken directly from each folder's
# .hydra/config.yaml or overrides.yaml, not inferred from the folder name --
# folder-name guessing has repeatedly turned out wrong in this investigation
# (see the two flagged anomalies below).

