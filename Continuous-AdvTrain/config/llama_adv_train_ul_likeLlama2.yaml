defaults:
  - base_config
  - path: base_path
  - _self_

hydra:
  run:
    dir: ${path.logging_path}/training/ul/${experiment_id}

experiment: adversarial_training

dataset:
  data_path: ../Reachable-Continuous-AdvTrain/data/
  utility_data: ultrachat_200k
  probabilities:
  - 0.125 # adv
  - 0.875 # utility

adversarial:
  iters: 10
  opt_config:
    type: sign
    lr: 1.0e-04 # -CONTROLLING- # Make it manually 10% of what real eps is
  eps: 0.05 # -CONTROLLING-
  debug: 0
  init_type: instruction
  relative_lr: False # -CONTROLLING- # Added
  tracking: # Added
    enabled: true
    top_k: 5
    store_step_summaries: true
    store_token_records: true
    store_topk_neighbours: true
    nearest_neighbor_chunk_size: 128

sfttrainer:
  packing: false
  max_seq_length: 256

training:
  num_train_epochs: 2 # Different here
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 8
  fp16: True
  bf16: False
  seed: 42 # I added seed

trainer_hparams:
  utility_weight: 1.0
  away_weight: 0.5
  toward_weight: 0.5
  away_cutoff: -7.5 # Different here
  toward_cutoff: 0.5
  away_loss_type: negative_cross_entropy
  trainer_type: ul
  dtype: auto

